name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generated files are up to date
        run: |
          if ! git diff --quiet -- dist docs README.md; then
            echo "::error::dist/, docs/ or README.md is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist docs README.md
            exit 1
          fi
